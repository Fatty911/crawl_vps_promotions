# ── GitHub Actions 硬开关（2026-10-05 用户裁定）────────────────────────
# GitHub 账户曾因反滥用机制误伤暂停，爬虫/AI 自修复禁止在 Actions 运行。
# 工作流主力 = 腾讯云 CNB（.cnb.yml）。此处 if:false 防止 UI 误开后仍执行。
# 七端代码对等同步，仅工作流免费资源不同。
name: VPS diagnosis

on:
  workflow_run:
    workflows: ["VPS deal monitor"]
    types: [completed]

concurrency:
  group: vps-diagnosis-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

env:
  UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
  UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
  UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

jobs:
  diagnose:
    name: Classify VPS monitor failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download upstream live evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh run download "$UPSTREAM_RUN_ID" --repo "${{ github.repository }}" --dir evidence || true
          EVIDENCE_FILE=$(find evidence -type f -name live-evidence.json | head -n 1)
          if [ -z "$EVIDENCE_FILE" ]; then
            echo "no live-evidence artifact found for run $UPSTREAM_RUN_ID"
            echo "no_evidence=true" >> "$GITHUB_ENV"
          else
            cp "$EVIDENCE_FILE" live-evidence.json
            echo "no_evidence=false" >> "$GITHUB_ENV"
          fi

      - name: Classify failures
        if: env.no_evidence != 'true'
        run: |
          python scripts/classify_vps_failure.py \
            --evidence live-evidence.json \
            --config providers.yaml \
            --out classification.json
          cat classification.json

      - name: Create or update diagnosis issue
        if: env.no_evidence != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/write_diagnosis_issue.py \
            --classification classification.json \
            --run-id "$UPSTREAM_RUN_ID" \
            --sha "$UPSTREAM_SHA" \
            --repo "${{ github.repository }}" \
            --title "[vps-diagnosis] run $UPSTREAM_RUN_ID failure" \
            --label monitor-diagnosis
