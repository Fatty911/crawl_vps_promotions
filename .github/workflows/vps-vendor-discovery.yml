name: VPS vendor discovery

on:
  workflow_dispatch:
    inputs:
      auto_extend:
        description: "自动合入通过验证和双评审的新厂商（true=commit providers.yaml）"
        type: boolean
        default: false
  schedule:
    # Weekly: Tuesday 04:00 UTC (12:00 CST), after the weekend deal wave.
    - cron: "0 4 * * 2"

permissions:
  contents: write
  issues: write

concurrency:
  group: vps-vendor-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up Node.js and OpenCode CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@latest

      - name: Fetch latest deals intel
        run: python scripts/fetch_deals.py --site-dir site

      - name: Discover new vendor candidates
        id: discover
        run: |
          python scripts/discover_vendors.py --site-dir site

      - name: Upload candidates artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-candidates
          path: state/vendor_candidates.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report candidates as issue (discovery only)
        if: ${{ !inputs.auto_extend }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/write_vendor_issue.py --candidates state/vendor_candidates.json

      - name: AI-extend vendors (validated + reviewed + committed)
        if: ${{ inputs.auto_extend }}
        env:
          GH_TOKEN: ${{ github.token }}
          KIMI_CODINGPLAN_API_KEY: ${{ secrets.KIMI_CODINGPLAN_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          VOLCENGINE_CODING_PLAN_API_KEY: ${{ secrets.VOLCENGINE_CODING_PLAN_API_KEY }}
        run: |
          python scripts/vendor_extend_runner.py \
            --candidates state/vendor_candidates.json \
            --commit
