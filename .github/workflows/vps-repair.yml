name: VPS auto-repair

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 失败 vps-monitor run ID（来自 vps-diagnosis issue）
        required: true
        type: string
      auto_repair:
        description: 确认启用 P0b 自动修复（需双 secrets）
        required: true
        type: boolean
        default: false

concurrency:
  group: vps-auto-repair
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

env:
  UPSTREAM_RUN_ID: ${{ inputs.run_id }}

jobs:
  repair:
    # Only a human dispatch with auto_repair=true may run; secrets are
    # validated inside the job (job-level if cannot read the secrets context).
    if: github.event.inputs.auto_repair == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Verify required secrets exist
        env:
          KIMI_CODINGPLAN_API_KEY: ${{ secrets.KIMI_CODINGPLAN_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          if [ -z "$VOLCENGINE_CODING_PLAN_API_KEY" ] && [ -z "$KIMI_CODINGPLAN_API_KEY" ]; then
            echo "P0b disabled: missing repair-agent key (VOLCENGINE_CODING_PLAN_API_KEY or KIMI_CODINGPLAN_API_KEY)"
            exit 1
          fi
          if [ -z "$NVIDIA_NIM_API_KEY" ]; then
            echo "P0b disabled: missing NVIDIA_NIM_API_KEY (required for the two-family review)"
            exit 1
          fi
          echo "repair-agent + review keys present"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          playwright install --with-deps chromium

      - name: Set up Node.js and OpenCode CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@latest

      - name: Download upstream live evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          if [ -n "$UPSTREAM_RUN_ID" ]; then
            gh run download "$UPSTREAM_RUN_ID" --repo "${{ github.repository }}" --dir evidence || true
          fi
          EVIDENCE_FILE=$(find evidence -type f -name live-evidence.json | head -n 1)
          if [ -z "$EVIDENCE_FILE" ]; then
            echo "no live-evidence artifact found for run $UPSTREAM_RUN_ID"
            exit 1
          fi
          cp "$EVIDENCE_FILE" live-evidence.json

      - name: Configure mihomo node-rotation runtime
        env:
          PROXY_SUBSCRIPTIONS: ${{ secrets.PROXY_SUBSCRIPTIONS }}
        run: |
          python scripts/setup_proxy_runtime.py \
            --test-url "https://www.cloudiplc.com/" \
            --test-url "https://lowendbox.com/" \
            || echo "mihomo runtime unavailable; verify will run direct"

      - name: Classify failures
        run: |
          python scripts/classify_vps_failure.py \
            --evidence live-evidence.json \
            --config providers.yaml \
            --out classification.json

      - name: Run bounded auto-repair for each site_breakage task
        env:
          GH_TOKEN: ${{ github.token }}
          KIMI_CODINGPLAN_API_KEY: ${{ secrets.KIMI_CODINGPLAN_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          VOLCENGINE_CODING_PLAN_API_KEY: ${{ secrets.VOLCENGINE_CODING_PLAN_API_KEY }}
          UPSTREAM_RUN_ID: ${{ inputs.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          report = json.load(open("classification.json", encoding="utf-8"))
          tasks = [t for t in report["tasks"] if t["classification"] == "site_breakage"]
          if not tasks:
              print("no site_breakage tasks; nothing to repair")
              sys.exit(0)
          run_id = os.environ["UPSTREAM_RUN_ID"]
          marker_base = run_id
          failures = 0
          repaired_count = 0
          retired_ids = set()
          # Walk the candidate list; tasks already confirmed external_retired
          # (verify said plan tokens are gone) do NOT consume a repair slot,
          # so each run's 3 slots go to fresh candidates (buyvm/linveo/etc.)
          # instead of re-checking the same retired tasks every run.
          for task in tasks:
              if repaired_count >= 3:
                  break
              if task["task_id"] in retired_ids:
                  continue
              marker = f"{marker_base}-{task['task_id']}"
              print(f"=== repairing {task['task_id']} (slot {repaired_count + 1}/3) ===")
              result = subprocess.run([
                  "python", "scripts/self_repair_runner_vps.py",
                  "--classification", "classification.json",
                  "--task-id", task["task_id"],
                  "--run-id", run_id,
                  "--attempt-marker", marker,
              ], capture_output=True, text=True, timeout=1500)
              print(result.stdout[-2000:])
              if result.stderr:
                  print(result.stderr[-2000:], file=sys.stderr)
              if result.returncode == 0:
                  repaired_count += 1
              elif "external_retired" in result.stderr:
                  # Confirmed retired this run; remember so later candidates
                  # get a slot instead.
                  retired_ids.add(task["task_id"])
                  print(f"retired confirmed: {task['task_id']} (no slot consumed)")
              else:
                  failures += 1
                  repaired_count += 1  # a failed attempt still used a slot
                  print(f"repair for {task['task_id']} exit {result.returncode}")
          if failures:
              print(f"{failures} repair(s) failed; see logs")
              sys.exit(0)  # diagnosis issue already reflects state; no false alarm
          PY
