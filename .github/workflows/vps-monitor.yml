# ── GitHub Actions 硬开关（2026-10-05 用户裁定）────────────────────────
# GitHub 账户曾因反滥用机制误伤暂停，爬虫/AI 自修复禁止在 Actions 运行。
# 工作流主力 = 腾讯云 CNB（.cnb.yml）。此处 if:false 防止 UI 误开后仍执行。
# 七端代码对等同步，仅工作流免费资源不同。
name: VPS deal monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '20 22 * * *'
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: vps-live-round
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          playwright install --with-deps chromium
      - name: Offline contract tests
        run: |
          python -m pytest -q
          python -m compileall -q vps_monitor scripts
      - name: Restore prior state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFIG_SHA=$(sha256sum providers.yaml | cut -d' ' -f1)
          python scripts/restore_state.py \
            --repo "${{ github.repository }}" \
            --branch main \
            --current-run-id "${{ github.run_id }}" \
            --config-sha256 "$CONFIG_SHA" \
            --destination state
      - name: Configure mihomo node-rotation runtime
        env:
          PROXY_SUBSCRIPTIONS: ${{ secrets.PROXY_SUBSCRIPTIONS }}
        run: |
          python scripts/setup_proxy_runtime.py \
            --test-url "https://www.cloudiplc.com/" \
            --test-url "https://lowendbox.com/" \
            || echo "mihomo runtime unavailable; monitor will run direct"
      - name: Build complete live round
        # mihomo runtime exports HTTP_PROXY=127.0.0.1:7890 for node rotation;
        # without it (setup failed) the monitor falls back to direct fetches.
        run: python -m vps_monitor.monitor --live --output
      - name: Clear crawler proxy environment
        if: always()
        run: python scripts/setup_proxy_runtime.py --clear || true
      - name: Upload early live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: site/data/live-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload early state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: state
          if-no-files-found: warn
          retention-days: 30
      - name: Structural publish gate
        run: python -m vps_monitor.monitor --structure-gate
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: |
            site/audit.json
            site/manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload precise public payload
        uses: actions/upload-artifact@v4
        with:
          name: pages-payload-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: site
          if-no-files-found: error
          retention-days: 30
      - name: Attest public manifest
        uses: actions/attest@v4
        with:
          subject-path: site/manifest.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

